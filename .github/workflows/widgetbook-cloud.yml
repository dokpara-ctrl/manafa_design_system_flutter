# Publishes the Widgetbook to Widgetbook Cloud on every push.
# Needs the repository secret WIDGETBOOK_API_KEY (Widgetbook Cloud > Project > Settings).
name: Widgetbook Cloud

on: push

jobs:
  widgetbook-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Test design system
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Widgetbook
        working-directory: widgetbook
        run: |
          flutter pub get
          dart run build_runner build -d
          flutter build web -t lib/main.dart

      - name: Install Widgetbook CLI
        run: dart pub global activate widgetbook_cli

      - name: Push Widgetbook build
        working-directory: widgetbook
        run: widgetbook cloud build push --api-key ${{ secrets.WIDGETBOOK_API_KEY }}
